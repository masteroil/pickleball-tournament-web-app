name: Publish umpire scoring to GitHub Pages
on:
  push:
    branches: [umpire-scoring-demo]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pickleball-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/umpire-scoring-demo'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/build-pages.mjs
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBwO6uLL2E9BW4ku14C413qj_Wncoe2YlE
          VITE_FIREBASE_APP_ID: 1:485000663659:web:76de55795ba9b2703f572e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v4
